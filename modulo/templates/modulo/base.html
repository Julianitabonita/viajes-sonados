<!DOCTYPE html>
<html lang="es" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block titulo %}Viajes soñados{% endblock %}</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        :root[data-bs-theme="dark"] {
            --bs-body-bg: #0b1220;
            --bs-body-color: #e8edf5;
            --bs-secondary-color: #a3b3cc;
            --bs-border-color: #26334a;
            --bs-link-color-rgb: 94, 234, 212;
            --bs-link-hover-color-rgb: 153, 246, 228;
        }
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(180deg, #0b1220 0%, #111c31 100%) fixed;
            min-height: 100vh;
        }
        .navbar-viajes {
            background: #0b1220;
            border-bottom: 1px solid #1f2b40;
        }
        .marca {
            font-weight: 700;
            font-size: 1.25rem;
            color: #fff;
        }
        .marca i {
            color: #2dd4bf;
        }
        .btn-aventura {
            background: #2dd4bf;
            border: 0;
            color: #04201c;
            font-weight: 600;
            border-radius: 50px;
            padding: 0.5rem 1.3rem;
            transition: transform 0.2s, background 0.2s;
        }
        .btn-aventura:hover {
            background: #5eead4;
            color: #04201c;
            transform: translateY(-2px);
        }
        .usuario {
            background: #1a2740;
            color: #cfe0f5;
            font-weight: 500;
        }
        .tarjeta {
            background: #121c2e;
            border: 1px solid #1f2b40;
            border-radius: 16px;
            transition: border-color 0.2s, transform 0.2s;
        }
        .tarjeta:hover {
            border-color: #2dd4bf;
            transform: translateY(-3px);
        }
                .pagination {
            --bs-pagination-color: #5eead4;
            --bs-pagination-bg: #121c2e;
            --bs-pagination-border-color: #26334a;
            --bs-pagination-hover-color: #99f6e4;
            --bs-pagination-hover-bg: #1a2740;
            --bs-pagination-hover-border-color: #2dd4bf;
            --bs-pagination-disabled-color: #a3b3cc;
            --bs-pagination-disabled-bg: #121c2e;
            --bs-pagination-disabled-border-color: #26334a;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-viajes sticky-top mb-5">
        <div class="container">
            <a class="navbar-brand marca" href="{% url 'modulo:lista' %}">
                <i class="bi bi-compass"></i> Viajes soñados
            </a>
            <div class="d-flex align-items-center gap-3">
                <a class="btn btn-aventura btn-sm" href="{% url 'modulo:crear' %}">
                    <i class="bi bi-plus-circle"></i> Nuevo viaje
                </a>
                <span class="badge rounded-pill usuario">
                    <i class="bi bi-person-circle"></i> {{ request.user.username }}
                </span>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% if messages %}
            {% for message in messages %}
            <div class="alert alert-success alert-dismissible fade show d-flex align-items-center gap-2 rounded-4 aviso" role="alert">
                <i class="bi bi-check-circle-fill"></i>
                <div>{{ message }}</div>
                <button type="button" class="btn-close ms-auto" data-bs-dismiss="alert" aria-label="Cerrar"></button>
            </div>
            {% endfor %}
        {% endif %}

        {% block contenido %}{% endblock %}
    </main>    

    <footer class="text-center text-secondary small pb-4">
        Cada gran viaje empieza con un sueño
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.querySelectorAll('.aviso').forEach(function (aviso) {
            setTimeout(function () {
                bootstrap.Alert.getOrCreateInstance(aviso).close();
            }, 4000);
        });
    </script>
</body>
</html>
